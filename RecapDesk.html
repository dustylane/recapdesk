<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap Desk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header bar over a 12-column drag/resize panel grid; collapses to 1 column on narrow windows (Zoom sidebar). */
:root{
  --bg:#0C1015; --panel:#151A21; --panel2:#0F141A; --line:#262D37; --line2:#353E4A;
  --fg:#E7ECF2; --muted:#A3AEBA; --faint:#808C99;
  --gold:#E8B649; --gold-ink:#F6DA9B; --gold-bg:#2A2312; --blue:#6CB0FF;
  --ok:#3FB950; --bad:#F0883E; --unk:#8B949E; --scope:#6CB0FF;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --fs:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:calc(15px * var(--fs));line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:#090C10;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:calc(24px * var(--fs));letter-spacing:.06em;white-space:nowrap}
.brand small{font-family:var(--body);font-weight:400;font-size:12px;letter-spacing:0;color:var(--muted);margin-left:8px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl label{font-size:12px;color:var(--muted)}
select{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;max-width:340px}
.btn{background:transparent;border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:13px;min-height:34px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0C1015;font-weight:600}
.btn.on{background:var(--fg);color:#0C1015;border-color:var(--fg)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.status{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.warn{background:var(--bad)} .dot.busy{background:var(--gold)}
details.menu{position:relative}
details.menu summary{list-style:none;border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:34px;display:flex;align-items:center}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px;min-width:250px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;z-index:60}
.pop h4{margin:0;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.pop .row{display:flex;flex-wrap:wrap;gap:6px}
.pop label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
#banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:10px 14px;border-radius:8px;background:var(--gold-bg);border:1px solid var(--gold);color:var(--gold-ink)}
#errbar{margin:10px 16px 0;padding:10px 14px;border-radius:8px;background:#2B1A10;border:1px solid var(--bad);color:#FFD2B0}
main.wrap{padding:6px max(10px,env(safe-area-inset-right,0px)) 40px max(10px,env(safe-area-inset-left,0px))}
.grid-stack-item-content.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;inset:5px}
.ph{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;background:#121720}
.pt{font-family:var(--display);font-weight:700;font-size:calc(19px * var(--fs));letter-spacing:.03em;white-space:nowrap}
.grip{color:var(--faint);font-size:12px;letter-spacing:-2px}
.ph .sp{flex:1}
.px{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:18px;line-height:1}
.px:hover{background:var(--line);color:var(--fg)}
.pb{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.src{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:8px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 6px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{border-top:0;font-size:11.5px;color:var(--muted);font-weight:500}
th.n,td.n{text-align:right}
.tblwrap{overflow-x:auto}
.teamtag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.dec{font-size:11px;color:var(--gold-ink);margin-left:6px;font-weight:600}
.sub{padding-left:16px;color:var(--muted)}
.scoreline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;margin:6px 0 10px}
.tm{display:flex;align-items:center;gap:12px}
.tm .ab{font-family:var(--display);font-weight:600;font-size:calc(28px * var(--fs));min-width:50px}
.tm .sc{font-family:var(--display);font-weight:700;font-size:calc(56px * var(--fs));line-height:1}
.tm.win .sc{color:var(--gold-ink)} .tm.lose .sc{color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold-ink);font-size:13px;font-weight:600}
.decs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.decs div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.decs b{display:block}
.decs span{font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.ls td.hl{color:var(--gold-ink);font-weight:600}
.wpbox{display:flex;flex-direction:column;height:100%}
.wpwrap{flex:1;min-height:120px;position:relative}
.wpwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.badge-n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#0C1015;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.pin{flex-shrink:0;border:1px solid var(--line2);background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;min-height:30px}
.pin.on{background:var(--gold);border-color:var(--gold);color:#0C1015}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.delta{font-family:var(--mono);font-weight:600;color:var(--gold-ink)}
.quote{margin-top:3px}
.fc form{display:flex;gap:8px}
.fc input{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:calc(15px * var(--fs))}
.fc input::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;color:#C9D1D9;text-align:left}
.result{margin-top:12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:6px}
.stat{display:inline-block;padding:3px 9px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.08em;color:#0C1015}
.ans{font-size:calc(19px * var(--fs));font-weight:600;line-height:1.3}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.lines div span:last-child{font-family:var(--mono);font-weight:600;text-align:right}
.rs-actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rs-n{font-family:var(--mono);font-weight:600;color:var(--gold-ink);width:22px;flex-shrink:0}
.kind{font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.ibtn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}
.livecard{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.livecard:first-child{border-top:0}
.livecard .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
#toast{position:fixed;right:16px;bottom:16px;max-width:420px;background:var(--panel);border:1px solid var(--gold);color:var(--fg);padding:12px 14px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:80}
.grid-stack>.grid-stack-placeholder>.placeholder-content{background:rgba(232,182,73,.10);border:1px dashed var(--gold);border-radius:10px;inset:5px}
.grid-stack-item>.ui-resizable-se{filter:invert(1) opacity(.55)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">RECAP DESK<small>MLB</small></div>
  <div class="ctl">
    <label for="gamesel">Game</label>
    <select id="gamesel" aria-label="Choose a final game"><option>Loading…</option></select>
    <label class="toggle"><input type="checkbox" id="follow"> Auto-load new finals</label>
    <button class="btn" id="refresh" type="button">Check now</button>
  </div>
  <div class="ctl">
    <details class="menu" id="layoutmenu">
      <summary>Layout</summary>
      <div class="pop">
        <h4>PRESETS</h4>
        <div class="row">
          <button class="btn" type="button" data-preset="desktop">Desktop</button>
          <button class="btn" type="button" data-preset="zoom">Zoom sidebar</button>
        </div>
        <h4>PANELS</h4>
        <div id="panelchecks"></div>
        <h4>TEXT SIZE</h4>
        <div class="row">
          <button class="btn" type="button" id="fsdown" aria-label="Smaller text">A−</button>
          <button class="btn" type="button" id="fsup" aria-label="Larger text">A+</button>
        </div>
        <p class="muted" style="margin:0;font-size:12px">Drag a panel by its title bar. Resize from its bottom-right corner. Your layout is saved in this browser.</p>
      </div>
    </details>
  </div>
  <div class="status" id="status" aria-live="polite"><span class="dot busy"></span><span>Starting…</span></div>
</header>
<div id="banner" hidden></div>
<div id="errbar" hidden></div>
<main class="wrap"><div class="grid-stack" id="grid"></div></main>
<div id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
<script>
'use strict';
/* =========================================================
   Recap Desk — every number comes from the MLB Stats API
   (statsapi.mlb.com). Nothing is estimated or generated.
   ========================================================= */
const API = 'https://statsapi.mlb.com';
const POLL_MS = 120000, LIVE_POLL_MS = 30000, STAMP_MS = 600000;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('recapdesk:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('recapdesk:' + k, JSON.stringify(v)); } catch (e) {} }
};
async function api(path) {
  const r = await fetch(API + path, { cache: 'no-store' });
  if (!r.ok) throw new Error('MLB Stats API returned ' + r.status);
  return r.json();
}
const ymd = d => d.toLocaleDateString('en-CA');
const shortDate = s => new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const longDate = s => new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const clock = d => d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';
const fmtAvg = (h, ab) => ab ? (h / ab).toFixed(3).replace(/^0/, '') : '—';
const fmtRate = v => (v == null || !isFinite(v)) ? '—' : v.toFixed(3).replace(/^0/, '');
const fmtIP = o => Math.floor(o / 3) + '.' + (o % 3);
const fmtERA = (er, o) => o ? (er * 27 / o).toFixed(2) : '—';
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[–—]/g, '-').replace(/[‘’]/g, "'");
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

function seriesShort(desc, gameType) {
  if (!desc || gameType === 'R') return 'Regular season';
  const lg = /^American/.test(desc) ? 'AL' : /^National/.test(desc) ? 'NL' : (desc.match(/^(AL|NL)\b/) || [])[1] || '';
  if (/World Series/.test(desc)) return 'World Series';
  if (/Championship/.test(desc)) return lg + 'CS';
  if (/Division/.test(desc)) return lg + 'DS';
  if (/Wild Card/.test(desc)) return lg + ' Wild Card';
  return desc;
}
const WINS_NEEDED = { F: 2, D: 3, L: 4, W: 4 };
const isFinal = g => g.status && g.status.abstractGameState === 'Final' && !/Postponed|Cancelled|Suspended/i.test(g.status.detailedState || '') && g.teams.away.score != null;

/* ---------- normalizers (one shape for every scope) ---------- */
function bBox(b) {
  if (!b) return null;
  const pa = b.plateAppearances || 0;
  if (!(pa > 0 || b.runs > 0 || b.stolenBases > 0)) return null;
  return { g: pa > 0 ? 1 : 0, pa, ab: b.atBats || 0, h: b.hits || 0, d2: b.doubles || 0, d3: b.triples || 0, hr: b.homeRuns || 0, rbi: b.rbi || 0, r: b.runs || 0, bb: b.baseOnBalls || 0, so: b.strikeOuts || 0, hbp: b.hitByPitch || 0, sf: b.sacFlies || 0, sb: b.stolenBases || 0 };
}
function pBox(p) {
  if (!p || !(p.battersFaced > 0 || p.outs > 0)) return null;
  return { g: 1, gs: p.gamesStarted || 0, outs: p.outs || 0, h: p.hits || 0, r: p.runs || 0, er: p.earnedRuns || 0, bb: p.baseOnBalls || 0, so: p.strikeOuts || 0, hr: p.homeRuns || 0, np: p.numberOfPitches || p.pitchesThrown || 0, bf: p.battersFaced || 0, w: p.wins || 0, l: p.losses || 0, sv: p.saves || 0, hld: p.holds || 0 };
}
function bSeason(s) {
  return { g: s.gamesPlayed || 0, pa: s.plateAppearances || 0, ab: s.atBats || 0, h: s.hits || 0, d2: s.doubles || 0, d3: s.triples || 0, hr: s.homeRuns || 0, rbi: s.rbi || 0, r: s.runs || 0, bb: s.baseOnBalls || 0, so: s.strikeOuts || 0, hbp: s.hitByPitch || 0, sf: s.sacFlies || 0, sb: s.stolenBases || 0 };
}
function pSeason(s) {
  return { g: s.gamesPitched || 0, gs: s.gamesStarted || 0, outs: s.outs || 0, h: s.hits || 0, r: s.runs || 0, er: s.earnedRuns || 0, bb: s.baseOnBalls || 0, so: s.strikeOuts || 0, hr: s.homeRuns || 0, np: s.numberOfPitches || 0, bf: s.battersFaced || 0, w: s.wins || 0, l: s.losses || 0, sv: s.saves || 0, hld: s.holds || 0 };
}
function addInto(a, b) { if (!b) return a; if (!a) return Object.assign({}, b); for (const k in b) a[k] = (a[k] || 0) + (b[k] || 0); return a; }
const obp = s => { const d = s.ab + s.bb + s.hbp + s.sf; return d ? (s.h + s.bb + s.hbp) / d : null; };
const slg = s => s.ab ? (s.h + s.d2 + 2 * s.d3 + 3 * s.hr) / s.ab : null;

/* ---------- app state ---------- */
const S = {
  finals: [], today: [], seen: null, game: null, loadingPk: null,
  follow: store.get('follow', true), checkedAt: null, error: null,
  pins: store.get('pins', []), result: null, claim: '', mixPid: null, stamp: null,
  fs: store.get('fs', 1)
};

/* ---------- schedule polling & auto-load ---------- */
let pollTimer = null;
async function pollSchedule(manual) {
  setStatus('busy', 'Checking for finals…');
  try {
    const end = new Date(), start = new Date(Date.now() - 7 * 864e5);
    const d = await api(`/api/v1/schedule?sportId=1&startDate=${ymd(start)}&endDate=${ymd(end)}&hydrate=linescore,team`);
    const games = d.dates.flatMap(x => x.games);
    let finals = games.filter(isFinal);
    if (!finals.length) {
      const s2 = new Date(Date.now() - 75 * 864e5);
      const d2 = await api(`/api/v1/schedule?sportId=1&startDate=${ymd(s2)}&endDate=${ymd(end)}&hydrate=team`);
      finals = d2.dates.flatMap(x => x.games).filter(isFinal);
    }
    finals.sort((a, b) => (b.gameDate || '').localeCompare(a.gameDate || '') || b.gamePk - a.gamePk);
    S.finals = finals;
    S.today = games.filter(g => g.officialDate === ymd(end) || g.status.abstractGameState === 'Live');
    S.checkedAt = new Date();
    S.error = null;
    renderGameSelect();
    renderPanel('live');
    const newOnes = S.seen ? finals.filter(g => !S.seen.has(g.gamePk)) : [];
    if (!S.seen) S.seen = new Set();
    finals.forEach(g => S.seen.add(g.gamePk));
    if (!S.game && !S.loadingPk && finals.length) await loadGame(finals[0].gamePk);
    else if (newOnes.length) {
      const g = newOnes[0];
      if (S.follow) { await loadGame(g.gamePk); toast('New final loaded: ' + gameLabel(g)); }
      else showBanner(newOnes);
    }
    if (S.game) await checkStamp();
  } catch (e) {
    S.error = 'Could not reach the MLB Stats API (' + e.message + '). The data on screen is from ' + clock(S.checkedAt) + '. Retrying automatically.';
  }
  renderErr();
  setStatus();
  schedulePoll();
}
function schedulePoll() {
  clearTimeout(pollTimer);
  const anyLive = S.today.some(g => g.status.abstractGameState === 'Live');
  pollTimer = setTimeout(pollSchedule, anyLive ? LIVE_POLL_MS : POLL_MS);
}
// MLB scorers sometimes change a ruling after the final. Reload quietly if the game data changed.
async function checkStamp() {
  const G = S.game;
  if (!G || Date.now() - (G.stampCheckedAt || 0) < STAMP_MS) return;
  G.stampCheckedAt = Date.now();
  try {
    const t = await api(`/api/v1.1/game/${G.pk}/feed/live/timestamps`);
    const last = Array.isArray(t) ? t[t.length - 1] : null;
    if (last && G.stamp && last !== G.stamp) { await loadGame(G.pk, true); toast('MLB updated this game’s data. The panels now show the corrected numbers.'); }
  } catch (e) {}
}
function gameLabel(g) {
  const a = g.teams.away, h = g.teams.home;
  const ab = t => (t.team.abbreviation || t.team.teamName || t.team.name);
  const ser = g.gameType === 'R' ? '' : seriesShort(g.seriesDescription, g.gameType) + (g.seriesGameNumber ? ' G' + g.seriesGameNumber : '') + ' · ';
  return `${shortDate(g.officialDate)} · ${ser}${ab(a)} ${a.score}, ${ab(h)} ${h.score}`;
}
function renderGameSelect() {
  const sel = $('#gamesel');
  const cur = S.game ? S.game.pk : (S.loadingPk || '');
  sel.innerHTML = S.finals.length ? S.finals.map(g => `<option value="${g.gamePk}"${g.gamePk == cur ? ' selected' : ''}>${esc(gameLabel(g))}</option>`).join('') : '<option>No finals found</option>';
}
function showBanner(list) {
  const b = $('#banner');
  b.innerHTML = `<b>New final${list.length > 1 ? 's' : ''}:</b> ${list.map(g => esc(gameLabel(g))).join(' · ')} <button class="btn primary" type="button" id="loadnew">Load ${esc(gameLabel(list[0]))}</button> <button class="btn" type="button" id="dismissnew">Dismiss</button>`;
  b.hidden = false;
  $('#loadnew').onclick = () => { b.hidden = true; loadGame(list[0].gamePk); };
  $('#dismissnew').onclick = () => { b.hidden = true; };
}

/* ---------- load one game + every scope the fact check needs ---------- */
async function loadGame(pk, quiet) {
  pk = +pk;
  S.loadingPk = pk;
  if (!quiet) setStatus('busy', 'Loading game data…');
  try {
    const [feed, wp, stamps] = await Promise.all([
      api(`/api/v1.1/game/${pk}/feed/live`),
      api(`/api/v1/game/${pk}/winProbability`).catch(() => []),

    out.push({ text: `${P[id].name} (${G.teams[side].abbr}) started: ${fmtIP(q.outs)} IP, ${plural(q.h, 'hit', 'hits')}, ${plural(q.r, 'run', 'runs')} (${q.er} earned), ${plural(q.bb, 'walk', 'walks')}, ${plural(q.so, 'strikeout', 'strikeouts')}, ${q.np} pitches.`, src: gsrc });

  });

  if (sw.length) out.push({ text: `Biggest swing (${sw[0].inn}): ${sw[0].desc} ${sw[0].delta} points of win probability.`, src: `Win probability, game ${G.pk}` });
  const batters = Object.values(P).filter(p => p.bat && p.bat.pa > 0);

    const b = p.bat, extra = [b.hr ? plural(b.hr, 'home run', 'home runs') : '', b.rbi ? b.rbi + ' RBI' : ''].filter(Boolean).join(', ');
    let t = `${p.name} (${p.team}) went ${b.h}-for-${b.ab}${extra ? ' with ' + extra : ''}.`;
    const s = G.post && G.agg.series[p.id] && G.agg.series[p.id].bat;
    if (s && G.seriesGames.length > 1) t += ` He is ${s.h}-for-${s.ab} (${fmtAvg(s.h, s.ab)}) in the ${G.short}.`;
    out.push({ text: t, src: G.post ? 'Box scores, this game and series' : gsrc });
  });
  batters.filter(p => p.bat.ab >= 4 && p.bat.h === 0).slice(0, 3).forEach(p => {
    let t = `${p.name} (${p.team}) went 0-for-${p.bat.ab}.`;
    const s = G.post && G.agg.series[p.id] && G.agg.series[p.id].bat;
    if (s && G.seriesGames.length > 1) t += ` He is ${s.h}-for-${s.ab} (${fmtAvg(s.h, s.ab)}) in the ${G.short}.`;
    out.push({ text: t, src: G.post ? 'Box scores, this game and series' : gsrc });
  });
  const rel = G.order[G.winner].pitchers.slice(1).map(id => P[id] && P[id].pit).filter(Boolean);
  if (rel.length) {
    const t = rel.reduce((a, q) => addInto(a, q), null);
    if (t.outs >= 6 && t.r === 0) out.push({ text: `${W.club} relievers: ${fmtIP(t.outs)} IP, ${plural(t.h, 'hit', 'hits')}, 0 runs.`, src: gsrc });
  }

    const rows = Object.entries(G.agg.series).map(([id, x]) => ({ p: P[id], b: x.bat })).filter(x => x.p && x.b && x.b.ab >= 10);
    rows.filter(x => x.b.h / x.b.ab >= 0.4).sort((a, b) => b.b.h / b.b.ab - a.b.h / a.b.ab).slice(0, 2)
      .forEach(x => out.push({ text: `${x.p.name} (${x.p.team}) is ${x.b.h}-for-${x.b.ab} (${fmtAvg(x.b.h, x.b.ab)}) in the ${G.short}.`, src: 'Box scores, series games' }));
    rows.filter(x => x.b.h / x.b.ab <= 0.1).sort((a, b) => a.b.h / a.b.ab - b.b.h / b.b.ab).slice(0, 2)
      .forEach(x => { if (!out.some(o => o.text.startsWith(x.p.name + ' (' + x.p.team + ') went 0-for'))) out.push({ text: `${x.p.name} (${x.p.team}) is ${x.b.h}-for-${x.b.ab} (${fmtAvg(x.b.h, x.b.ab)}) in the ${G.short}.`, src: 'Box scores, series games' }); });
  }
  const dec = G.feed.liveData.decisions || {};

  return out;
}

let grid;
function initGrid() {

// Narrow windows (a Zoom sidebar, a phone) stack the panels in one column, in layout order.

function respond() {

}

  $('#grid').appendChild(el);
  grid.makeWidget(el, auto ? { id: it.id, w: it.w, h: it.h, autoPosition: true } : { id: it.id, x: it.x, y: it.y, w: it.w, h: it.h });

function renderScore(el, G) {

  }

    else { const sp = G.players[d.id] && G.players[d.id].seasonPit; if (sp) line = lab === 'SAVE' ? `Season saves: ${sp.saves}` : `Season ${sp.wins}–${sp.losses}`; }
    return `<div><span>${lab}</span><b>${esc(d.fullName)}</b><span>${esc(line)}</span></div>`;
  };
  const gi = G.feed.gameData.gameInfo || {}, wx = G.feed.gameData.weather || {};

function renderWP(el, G) {
  if (!G.wp.length) { el.innerHTML = '<p class="empty">MLB has no win probability data for this game.</p>'; return; }
  el.innerHTML = `<div class="wpbox"><div class="wpwrap"><canvas id="wpc" role="img" aria-label="Win probability chart for ${esc(G.teams.home.abbr)} through the game"></canvas></div>
    <div class="src">Line = ${esc(G.teams.home.abbr)}’s chance to win after each plate appearance (${G.wp.length}). Dots = swing plays. Source: MLB Stats API · winProbability, game ${G.pk}</div></div>`;
  drawWP();
}
function drawWP() {
  const G = S.game, cv = document.getElementById('wpc');
  if (!G || !cv || !G.wp.length) return;
  const box = cv.parentElement, W = box.clientWidth, H = box.clientHeight;
  if (W < 50 || H < 50) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), col = k => css.getPropertyValue(k).trim();
  const L = 64, Rp = 10, T = 8, B = 22, pw = W - L - Rp, ph = H - T - B, wp = G.wp, n = wp.length;
  const X = i => L + (n === 1 ? 0 : i / (n - 1) * pw), Y = v => T + (100 - v) / 100 * ph;
  x.font = '11px ' + col('--mono'); x.fillStyle = col('--muted'); x.textBaseline = 'middle'; x.textAlign = 'right';
  x.fillText(G.teams.home.abbr + ' 100%', L - 8, Y(100) + 5); x.fillText('50%', L - 8, Y(50)); x.fillText(G.teams.away.abbr + ' 100%', L - 8, Y(0) - 5);
  x.strokeStyle = col('--line'); x.lineWidth = 1;
  x.strokeRect(L + .5, T + .5, pw - 1, ph - 1);
  const starts = []; wp.forEach((p, i) => { if (p.about.halfInning === 'top' && (i === 0 || wp[i - 1].about.inning !== p.about.inning)) starts.push({ i, inn: p.about.inning }); });
  x.textAlign = 'center'; x.textBaseline = 'top';
  starts.forEach((s, k) => {
    if (k > 0) { x.beginPath(); x.moveTo(Math.round(X(s.i)) + .5, T); x.lineTo(Math.round(X(s.i)) + .5, T + ph); x.stroke(); }
    const end = k + 1 < starts.length ? starts[k + 1].i : n - 1;
    x.fillStyle = col('--muted'); x.fillText(String(s.inn), (X(s.i) + X(end)) / 2, T + ph + 6);
  });
  x.setLineDash([4, 4]); x.strokeStyle = col('--line2'); x.beginPath(); x.moveTo(L, Y(50) + .5); x.lineTo(L + pw, Y(50) + .5); x.stroke(); x.setLineDash([]);
  x.beginPath(); x.moveTo(X(0), Y(50)); wp.forEach((p, i) => x.lineTo(X(i), Y(p.homeTeamWinProbability)));
  x.lineTo(X(n - 1), Y(50)); x.closePath(); x.fillStyle = 'rgba(108,176,255,0.12)'; x.fill();
  x.beginPath(); wp.forEach((p, i) => i ? x.lineTo(X(i), Y(p.homeTeamWinProbability)) : x.moveTo(X(i), Y(p.homeTeamWinProbability)));
  x.strokeStyle = col('--blue'); x.lineWidth = 2.25; x.lineJoin = 'round'; x.stroke();
  swingPlays(G).forEach(s => {
    const cx = X(s.idx), cy = Y(wp[s.idx].homeTeamWinProbability);
    x.beginPath(); x.arc(cx, cy, 10, 0, Math.PI * 2); x.fillStyle = col('--gold'); x.fill(); x.lineWidth = 2; x.strokeStyle = col('--bg'); x.stroke();
    x.fillStyle = '#0C1015'; x.font = '600 11px ' + col('--body'); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(s.n), cx, cy + .5);
  });
}

function renderPitching(el, G) {

function renderMix(el, G) {
  const pitchers = ['away', 'home'].flatMap(side => G.order[side].pitchers.map(id => G.players[id]).filter(p => p && p.pit));
  if (!pitchers.some(p => p.id === S.mixPid)) S.mixPid = pitchers[0] && pitchers[0].id;
  const m = {}; let tot = 0;
  G.feed.liveData.plays.allPlays.forEach(pl => {
    if (pl.matchup.pitcher.id !== S.mixPid) return;
    pl.playEvents.forEach(e => {
      if (!e.isPitch || !e.details || !e.details.type) return;
      const t = e.details.type.description, r = m[t] = m[t] || { n: 0, v: 0, vn: 0, max: 0, cs: 0, ss: 0, ip: 0 };
      r.n++; tot++;
      const v = e.pitchData && e.pitchData.startSpeed; if (v) { r.v += v; r.vn++; r.max = Math.max(r.max, v); }
      const code = e.details.call && e.details.call.code;
      if (code === 'C') r.cs++; if (code === 'S' || code === 'W') r.ss++; if (code === 'X' || code === 'D' || code === 'E') r.ip++;
    });
  });
  const rows = Object.entries(m).sort((a, b) => b[1].n - a[1].n).map(([t, r]) => `<tr><th>${esc(t)}</th><td class="n">${r.n}</td><td class="n">${(r.n / tot * 100).toFixed(1)}%</td><td class="n">${r.vn ? (r.v / r.vn).toFixed(1) : '—'}</td><td class="n">${r.vn ? r.max.toFixed(1) : '—'}</td><td class="n">${r.cs}</td><td class="n">${r.ss}</td><td class="n">${r.ip}</td></tr>`).join('');
  el.innerHTML = `<label class="muted" for="mixsel" style="font-size:12px">Pitcher</label> <select id="mixsel">${pitchers.map(p => `<option value="${p.id}"${p.id === S.mixPid ? ' selected' : ''}>${esc(p.team)} · ${esc(p.name)}</option>`).join('')}</select>
    <div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>Pitch</th><th class="n">#</th><th class="n">Usage</th><th class="n">Avg mph</th><th class="n">Top mph</th><th class="n">Called K</th><th class="n">Swinging K</th><th class="n">In play</th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="muted">No pitch data.</td></tr>'}</tbody></table></div>
    <div class="src">${tot} pitches in this game. Season comparisons need Statcast (not connected). Source: MLB Stats API · pitch-by-pitch, game ${G.pk}</div>`;
  $('#mixsel', el).onchange = e => { S.mixPid = +e.target.value; renderPanel('mix'); };
}

function buildFact() {
  const el = body('fact');
  el.classList.add('fc');
  el.innerHTML = `<form id="fcform" autocomplete="off"><label for="claim" class="muted" style="position:absolute;left:-9999px">Claim to check</label>
    <input id="claim" type="text" placeholder="Type a line you plan to say. Press Enter. ( / to focus )"><button class="btn primary" type="submit">Check</button></form>
    <div class="chips" id="fcchips"></div><div id="fcresult"></div>`;
  $('#claim').value = S.claim;
  $('#fcform').addEventListener('submit', e => { e.preventDefault(); runCheck($('#claim').value); });
  renderFactResult();
}
function factExamples(G) {
  if (!G) return [];
  const ex = [], P = G.players;
  const st = P[G.order[G.winner].pitchers[0]];
  if (st && st.pit) ex.push(`${st.name} struck out ${st.pit.so} tonight`);
  if (G.post && G.seriesGames.length) {
    const rows = Object.entries(G.agg.series).map(([id, x]) => ({ p: P[id], b: x.bat })).filter(x => x.p && x.b && x.b.ab >= 6).sort((a, b) => b.b.ab - a.b.ab);
    if (rows[0]) ex.push(`${rows[0].p.name} is hitting ${fmtAvg(Math.max(0, rows[0].b.h + 1), rows[0].b.ab)} in the ${G.short}`);
    const W = G.teams[G.winner], L = G.teams[G.loser], a = G.seriesWins[W.id], b = G.seriesWins[L.id];
    ex.push(`The ${a >= b ? W.club : L.club} lead the series ${Math.max(a, b)}-${Math.min(a, b)}`);
  }
  const hr = Object.values(P).find(p => p.bat && p.bat.hr > 0);
  if (hr) ex.push(`${hr.name} has ${hr.bat.hr} home run${hr.bat.hr === 1 ? '' : 's'}`);
  ex.push(`The ${G.teams.away.club} are the first team to do this since 1990`);
  return ex;
}
function renderFactResult() {
  const box = document.getElementById('fcresult'); if (!box) return;
  const chips = document.getElementById('fcchips');
  const ex = factExamples(S.game);
  chips.innerHTML = ex.length ? '<span class="muted" style="font-size:12px;width:100%">Try one:</span>' + ex.map(t => `<button class="chip" type="button">${esc(t)}</button>`).join('') : '';
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { $('#claim').value = b.textContent; runCheck(b.textContent); });
  const r = S.result;
  if (!r) { box.innerHTML = ''; return; }
  const color = { 'CONFIRMED': 'var(--ok)', 'INCORRECT': 'var(--bad)', 'CANNOT VERIFY': 'var(--unk)', 'NEEDS SCOPE': 'var(--scope)', 'AMBIGUOUS': 'var(--scope)' }[r.status];
  box.innerHTML = `<div class="result"><div class="kv" style="justify-content:space-between"><span class="stat" style="background:${color}">${r.status}</span>${pinBtn('fc:' + (S.game ? S.game.pk : '') + ':' + norm(r.claim), 'FACT CHECK', `“${r.claim}” → ${r.status}: ${r.answer}`, r.source || 'Fact check')}</div>
    <div class="muted" style="font-size:13px">Claim: “${esc(r.claim)}”</div><div class="ans">${esc(r.answer)}</div>
    ${r.lines.length ? `<div class="lines">${r.lines.map(l => `<div><span>${esc(l.label)}</span><span>${esc(l.value)}</span></div>`).join('')}</div>` : ''}
    <div style="font-size:14px;color:#C9D1D9">${esc(r.detail)}</div>${r.source ? `<div class="src">${esc(r.source)}</div>` : ''}</div>`;
}
function runCheck(t) { S.claim = t; S.result = check(t); renderFactResult(); }

function renderRunsheet(el) {
  const pins = S.pins;
  el.innerHTML = `<div class="rs-actions"><button class="btn" type="button" id="rscopy"${pins.length ? '' : ' disabled'}>Copy as text</button><button class="btn" type="button" id="rsdl"${pins.length ? '' : ' disabled'}>Download .txt</button><button class="btn" type="button" id="rsclear"${pins.length ? '' : ' disabled'}>${S.clearArm ? 'Click again to clear' : 'Clear'}</button></div>`
    + (pins.length ? pins.map((p, i) => `<div class="item"><span class="rs-n">${i + 1}</span><div class="body"><div class="kind">${esc(p.kind)} · ${esc(p.game || '')}</div><div style="font-size:14px">${esc(p.text)}</div><div class="src" style="margin-top:2px">${esc(p.src)}</div></div>
      <div style="display:flex;gap:4px"><button class="ibtn" type="button" data-mv="${i}" data-d="-1" aria-label="Move up"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button class="ibtn" type="button" data-mv="${i}" data-d="1" aria-label="Move down"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><button class="ibtn" type="button" data-rm="${i}" aria-label="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>`).join('')
      : '<p class="empty">Pin storylines, swing plays or fact-check results. They collect here in show order and stay saved in this browser.</p>');
  const txt = () => S.pins.map((p, i) => `${i + 1}. [${p.kind}] ${p.text}\n   ${p.game ? p.game + ' · ' : ''}Source: ${p.src}`).join('\n\n');
  const cp = $('#rscopy', el); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(txt()); toast('Run sheet copied.'); } catch (e) { toast('Copy failed. Use Download instead.'); } };
  const dl = $('#rsdl', el); if (dl) dl.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt()], { type: 'text/plain' })); a.download = 'run-sheet-' + ymd(new Date()) + '.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  const cl = $('#rsclear', el); if (cl) cl.onclick = () => { if (S.clearArm) { S.pins = []; S.clearArm = false; store.set('pins', S.pins); refreshPins(); } else { S.clearArm = true; renderPanel('runsheet'); setTimeout(() => { S.clearArm = false; renderPanel('runsheet'); }, 4000); } };
  el.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.d; if (j < 0 || j >= S.pins.length) return; const a = S.pins; [a[i], a[j]] = [a[j], a[i]]; store.set('pins', a); renderPanel('runsheet'); });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.pins.splice(+b.dataset.rm, 1); store.set('pins', S.pins); refreshPins(); });
}
function refreshPins() { ['swings', 'stories', 'runsheet', 'fact'].forEach(renderPanel); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pin]'); if (!b) return;
  const key = b.dataset.pin, i = S.pins.findIndex(p => p.key === key);
  if (i >= 0) S.pins.splice(i, 1);
  else S.pins.push({ key, kind: b.dataset.kind, text: b.dataset.text, src: b.dataset.src, game: S.game ? gameLabel(S.finals.find(g => g.gamePk === S.game.pk) || { teams: { away: { team: { abbreviation: S.game.teams.away.abbr }, score: S.game.teams.away.r }, home: { team: { abbreviation: S.game.teams.home.abbr }, score: S.game.teams.home.r } }, officialDate: S.game.date, gameType: 'R' }) : '' });
  store.set('pins', S.pins); refreshPins();
});

function renderLive(el) {
  const games = S.today;
  if (!games.length) { el.innerHTML = `<p class="empty">No games today.</p><div class="src">Checked ${clock(S.checkedAt)}</div>`; return; }
  el.innerHTML = games.map(g => {
    const A = g.teams.away, H = g.teams.home, st = g.status.abstractGameState, l = g.linescore || {};
    let state = g.status.detailedState;
    if (st === 'Live' && l.currentInning) {
      const bases = l.offense ? ['first', 'second', 'third'].filter(k => l.offense[k]).map(k => ({ first: '1st', second: '2nd', third: '3rd' })[k]) : [];
      state = `${l.inningHalf || ''} ${ord(l.currentInning)} · ${plural(l.outs || 0, 'out', 'outs')} · ${bases.length ? 'On: ' + bases.join(', ') : 'Bases empty'}`;
    } else if (st === 'Preview') state = new Date(g.gameDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const sc = (A.score != null && st !== 'Preview') ? `${A.score}–${H.score}` : '';
    return `<div class="livecard"><div class="top"><span>${esc(A.team.abbreviation || A.team.name)} at ${esc(H.team.abbreviation || H.team.name)}</span><span class="num">${sc}</span></div><div class="muted" style="font-size:13px">${esc(state)}${g.gameType !== 'R' ? ' · ' + esc(seriesShort(g.seriesDescription, g.gameType)) + (g.seriesGameNumber ? ' G' + g.seriesGameNumber : '') : ''}</div></div>`;
  }).join('') + `<div class="src">Refreshes every ${games.some(g => g.status.abstractGameState === 'Live') ? '30 seconds' : '2 minutes'}. Checked ${clock(S.checkedAt)}</div>`;
}

/* ---------- chrome ---------- */
function setStatus(kind, msg) {
  const el = $('#status');
  if (kind) { el.innerHTML = `<span class="dot ${kind}"></span><span>${esc(msg)}</span>`; return; }
  const ok = !S.error;
  el.innerHTML = `<span class="dot ${ok ? '' : 'warn'}"></span><span>${S.game ? 'Game loaded ' + clock(S.game.loadedAt) + ' · ' : ''}Checked ${clock(S.checkedAt)}</span>`;
}
function renderErr() { const e = $('#errbar'); e.hidden = !S.error; e.textContent = S.error || ''; }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 6000); }

function boot() {
  document.documentElement.style.setProperty('--fs', S.fs);
  $('#follow').checked = S.follow;
  $('#follow').onchange = e => { S.follow = e.target.checked; store.set('follow', S.follow); };
  $('#refresh').onclick = () => pollSchedule(true);
  $('#gamesel').onchange = e => { if (+e.target.value) loadGame(+e.target.value); };
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { applyLayout(PRESETS[b.dataset.preset]); $('#layoutmenu').open = false; });
  const setFs = v => { S.fs = Math.min(1.5, Math.max(0.85, Math.round(v * 100) / 100)); store.set('fs', S.fs); document.documentElement.style.setProperty('--fs', S.fs); drawWP(); };
  $('#fsup').onclick = () => setFs(S.fs + 0.1); $('#fsdown').onclick = () => setFs(S.fs - 0.1);
  document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { const i = $('#claim'); if (i) { e.preventDefault(); i.focus(); i.select(); } } });
  document.addEventListener('click', e => { const m = $('#layoutmenu'); if (m.open && !m.contains(e.target)) m.open = false; });
  if (!window.GridStack) { $('#errbar').hidden = false; $('#errbar').textContent = 'The layout library did not load. Check the internet connection and reload.'; return; }
  initGrid();
  pollSchedule();
}
boot();
window.RecapDesk = { S, check, loadGame, storylines, swingPlays };
</script>
</body>
